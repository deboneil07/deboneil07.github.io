name: pages
on:
  push:
    branches: [main]
    paths: [content/**, templates/**]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install matte
        run: cargo install --git https://github.com/deboneil07/matte --locked
      - name: build site
        run: |
          BASE="${PAGES_BASE_URL:-}"
          if [ -z "$BASE" ]; then
            REPO="${GITHUB_REPOSITORY#*/}"
            OWNER="${GITHUB_REPOSITORY%/*}"
            if [ "$REPO" = "${OWNER}.github.io" ]; then
              BASE="https://${OWNER}.github.io"
            else
              BASE="https://${OWNER}.github.io/${REPO}"
            fi
          fi
          echo "base_url=$BASE"
          matte build --base-url "$BASE"
        env:
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
